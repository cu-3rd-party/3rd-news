<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3rd-news · лента глазами клиента</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #6b7280;
        --line: #e3e6ea;
        --chip: #f3f4f6;
        --chip-on: #16181d;
        --chip-on-fg: #ffffff;
        --accent: #b03030;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181d;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --line: #2b2f36;
          --chip: #23262d;
          --chip-on: #e8eaed;
          --chip-on-fg: #16181d;
          --accent: #e06a6a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      header {
        position: sticky; top: 0; z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 12px 20px;
      }
      h1 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      input[type="text"], input[type="password"], select {
        background: var(--bg); color: var(--fg);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 6px 9px; font: inherit;
      }
      input[type="text"] { min-width: 220px; }
      button {
        background: var(--chip); color: var(--fg); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 11px; font: inherit; cursor: pointer;
      }
      button:hover { border-color: var(--muted); }
      main { padding: 16px 20px 60px; max-width: 900px; }
      .facets { padding: 10px 20px; border-bottom: 1px solid var(--line); }
      .axis { margin: 7px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
      .axis > b { font-weight: 600; font-size: 12px; color: var(--muted); min-width: 120px; }
      .chip {
        border: 1px solid var(--line); background: var(--chip);
        border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer;
      }
      .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
      .chip .n { color: var(--muted); font-size: 11px; margin-left: 5px; }
      .chip[aria-pressed="true"] .n { color: var(--chip-on-fg); opacity: 0.7; }
      .count { color: var(--muted); font-size: 13px; padding: 10px 0; }
      article { border-bottom: 1px solid var(--line); padding: 16px 0; }
      article h2 { font-size: 16px; margin: 0 0 4px; }
      .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .body { white-space: pre-wrap; overflow-wrap: anywhere; }
      .body a { color: var(--accent); }
      .labels { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
      .label { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
      .shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .shots img { max-height: 220px; border-radius: 6px; border: 1px solid var(--line); }
      .file { font-size: 12px; color: var(--muted); }
      .empty { color: var(--muted); padding: 40px 0; }
      .error { color: var(--accent); padding: 10px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>3rd-news · лента глазами клиента</h1>
      <div class="row">
        <input type="password" id="key" placeholder="ключ ленты (tnk_… или tn2_…)" size="34" />
        <button id="save">запомнить</button>
        <input type="text" id="q" placeholder="поиск по тексту" />
        <select id="sort">
          <option value="published_at">по дате новости</option>
          <option value="received_at">по дате поступления</option>
          <option value="importance">по важности</option>
        </select>
        <label class="file"><input type="checkbox" id="withfiles" /> только с вложениями</label>
        <button id="reset">сбросить фильтры</button>
      </div>
    </header>
    <div class="facets" id="facets"></div>
    <main>
      <div class="count" id="count"></div>
      <div id="list"></div>
      <div class="row" id="more"></div>
    </main>
    <script src="/preview.js"></script>
  </body>
</html>
