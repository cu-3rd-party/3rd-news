[project]
name = "thirdnews-tools"
version = "2.0.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "numpy>=2.4.3",
    "pydantic-settings>=2.15.0",
    "thirdnews",
    "thirdnews-contracts",
]

[project.scripts]
quality-sync = "tools.quality:sync"
quality-test = "tools.quality:test"
quality-lint = "tools.quality:lint"
quality-format = "tools.quality:format"
quality-integration = "tools.quality:integration"
quality-mutation = "tools.quality:mutation"
quality-audit = "tools.quality:audit"
quality-sql = "tools.quality:sql"
contracts-check = "tools.contracts:verify"
contracts-export = "tools.contracts:export"
project-clean = "tools.clean:clean"
evaluation = "tools.lib.handlers.evaluation:main"
corpus = "tools.lib.handlers.corpus:main"
taxonomy-apply = "tools.lib.handlers.taxonomy:main"
compose-smoke = "tools.ops.compose_smoke:run"
search-reindex = "tools.ops.reindex:run"
pipeline-load = "tools.ops.pipeline_load:main"

[dependency-groups]
lint = ["basedpyright>=1.36.2", "ruff>=0.14.14", "ty>=0.0.17"]
test = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[tool.uv.sources]
thirdnews = { path = "../services/main" }
thirdnews-contracts = { path = "../packages/python/contracts" }

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["tools*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["."]
exclude = [".venv", "build"]
extraPaths = ["..", "../services/main"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["test"]
