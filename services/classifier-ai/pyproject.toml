[project]
name = "thirdnews-classifier-ai"
version = "2.0.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "granian>=2.8.2",
    "pydantic-settings>=2.12.0",
    "thirdnews-contracts[server]",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lib*"]

[dependency-groups]
lint = ["basedpyright>=1.36.2", "ruff>=0.14.14", "ty>=0.0.17"]
test = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[tool.uv.sources]
thirdnews-contracts = { path = "../../packages/python/contracts" }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["lib", "main.py", "test"]
exclude = [".venv", "build"]
