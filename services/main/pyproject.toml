[project]
name = "thirdnews-main"
version = "0.1.0"
description = "3rd-news main service: ingest, storage, taxonomy, classification orchestration, delivery"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]
