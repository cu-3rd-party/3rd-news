[project]
name = "thirdnews-contracts"
version = "2.0.2"
description = "Public contracts (models, signing, clients) for the 3rd-news aggregation platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "joserfc>=1.7.5",
    "pydantic>=2.13.5",
]

[project.optional-dependencies]
server = ["fastapi>=0.141.1"]

[dependency-groups]
lint = ["basedpyright>=1.36.2", "fastapi>=0.141.1", "ruff>=0.14.14", "ty>=0.0.17"]
test = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thirdnews_contracts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["build"]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["thirdnews_contracts", "tests"]
exclude = [".venv", "build"]
