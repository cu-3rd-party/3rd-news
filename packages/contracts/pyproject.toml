[project]
name = "thirdnews-contracts"
version = "0.1.0"
description = "Public contracts (models, signing, clients) for the 3rd-news aggregation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.110"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thirdnews_contracts*"]
